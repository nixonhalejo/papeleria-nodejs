services:
  postgres:
    image: postgres:16
    container_name: papeleria-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: papeleria
      POSTGRES_PASSWORD: papeleria123
      POSTGRES_DB: papeleria_db
    ports:
      - "5432:5432"
    volumes:
      - papeleria_pgdata:/var/lib/postgresql/data

volumes:
  papeleria_pgdata: